name: Daily school information check
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-school-check.yml'
      - 'scripts/check_schools.py'
      - 'tests/test_monitor.py'
permissions:
  contents: write
  pages: write
concurrency:
  group: school-information-update
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test monitor
        run: python -m unittest discover -s tests -v
      - name: Check official school websites
        id: monitor
        continue-on-error: true
        run: python scripts/check_schools.py
      - name: Commit observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/schools.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: daily school source check'
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN commits do not trigger branch-based Pages publication.
      - name: Publish refreshed JSON on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Report complete source outage
        if: steps.monitor.outcome == 'failure'
        run: |
          echo 'No sources could be checked. Failure details were saved in the JSON.'
          exit 1
